<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<img class="logo" src="../icons/BasicIcon.svg" />

	<!--USERNAME FIELD-->
	<div style="align-self: center; margin-right: 3vh">
		<img id="textbox-icon" src="../icons/UserIcon.svg" style="margin-right: .2vh" />
		<textarea id="username" class="username" maxlength="16" spellcheck="false" placeholder="Username"></textarea>
	</div>

	<!--PASSWORD FIELD-->
	<div style="align-self: center; margin-right: 3vh">
		<img id="textbox-icon" src="../icons/LockIcon.svg" style="margin-right: .2vh" />
		<textarea id="password" class="password" maxlength="16" spellcheck="false" placeholder="Password"></textarea>
	</div>


	<!--LOG-IN BUTTON-->
	<button href="Homescreen.html">Log-In</button>

	<script src="clientLogin.js"></script>
</body>

</html>
